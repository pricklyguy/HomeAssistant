substitutions:
  device_name: "momsheartv2"
  friendly_name: "Moms Heart V2"
  board_type: "esp32-s3-devkitm-1"
  framework_type: "esp-idf"
  led_pin: "GPIO2"
  led_count: "40"
  busy_timeout_seconds: "2"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESP32-S3 CYD Valentine/Mothers Day Heart V2"
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    build_flags:
      - -DBOARD_HAS_PSRAM
      - -DARDUINO_USB_MODE=1
      - -DARDUINO_USB_CDC_ON_BOOT=1

packages:
  common: !include common_sensors.yaml

esp32:
  board: ${board_type}
  variant: esp32s3
  framework:
    type: ${framework_type}

logger:
  level: debug

api:


ota:
  - platform: esphome
  

wifi:
  networks:
  
  - ssid: !secret prickly_ssid
    password: !secret prickly_password

  - ssid: !secret wifi_ssid
    password: !secret wifi_password    
  
  power_save_mode: none
 

  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

captive_portal:


psram:
  mode: octal
  speed: 40MHz
  ignore_not_found: false



# ---------- TIME ----------
time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Phoenix"

# ---------- FONTS ----------
font:
  - file: "fonts/DejaVuSans.ttf"
    id: font_big
    size: 40
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~♥"

  - file: "fonts/DejaVuSans.ttf"
    id: font_small
    size: 18
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~♥"

  - file: "fonts/Roboto-Bold.ttf"
    id: font_clock
    size: 96
    glyphs: "0123456789:"

  - file: "fonts/Roboto-Bold.ttf"
    id: f_ampm
    size: 24
    glyphs: "AMP "

# --- Select Clock Color -----
select:
  - platform: template
    name: "${friendly_name} Clock Color"
    id: clock_color
    optimistic: true
    restore_value: true
    initial_option: "Green"
    options:
      - "White"
      - "Warm White"
      - "Red"
      - "Prickly"
      - "Orange"
      - "Yellow"
      - "Green"
      - "Cyan"
      - "Blue"
      - "Purple"        

# ---------- GLOBALS ----------
globals:
  - id: mode_index
    type: int
    initial_value: '0'

  - id: mode_name
    type: std::string
    initial_value: '"Off"'

  - id: screen_mode
    type: int
    initial_value: '0'   # 0=clock,1=menu

  - id: menu_timer
    type: int
    initial_value: '0'

  - id: song_index
    type: int
    initial_value: '0'

  - id: song_name
    type: std::string
    initial_value: '"Beautiful Mess"'

  - id: active_message
    type: std::string
    initial_value: '"I will always love you!"'

  - id: ui_busy
    type: bool
    initial_value: 'false'

  - id: busy_timer
    type: int
    initial_value: '0'   

  - id: playback_target_index
    type: int
    initial_value: '0'

  - id: playback_target_name
    type: std::string
    initial_value: '"Local"'     

# ---------- SPI DISPLAY ----------
spi:
  id: my_spi
  clk_pin: GPIO12
  mosi_pin: GPIO11

display:
  - platform: mipi_spi
   
    model: ILI9341
    cs_pin: GPIO10
    dc_pin: GPIO46
    invert_colors: true
    rotation: 90
    update_interval: 400ms
    lambda: |-

      //SCREEN MODES 0=CLOCK, 1=MENU, 2=PLAYING, 3=LOADING, 4=STOPPING

      Color clk_color(255, 80, 120);
      auto cc = id(clock_color).current_option();

      if      (cc == "White")      clk_color = Color(242, 250, 250);
      else if (cc == "Warm White") clk_color = Color(255, 220, 150);
      else if (cc == "Red")        clk_color = Color(255,   0,   0);
      else if (cc == "Prickly")    clk_color = Color( 52, 209, 198);
      else if (cc == "Orange")     clk_color = Color(255, 100,   0);
      else if (cc == "Yellow")     clk_color = Color(255, 220,   0);
      else if (cc == "Green")      clk_color = Color(  0, 255,  50);
      else if (cc == "Cyan")       clk_color = Color(  0, 220, 255);
      else if (cc == "Blue")       clk_color = Color( 50, 100, 255);
      else if (cc == "Purple")     clk_color = Color(180,   0, 255);


      it.fill(Color(0,0,0));

      if (id(screen_mode) == 0) {
        // CLOCK
        auto now = id(sntp_time).now();

        if (!now.is_valid()) {
          it.printf(160, 100, id(font_small), Color(200, 0, 0),
                    TextAlign::CENTER, "No Time Sync");
          return;
        }

        int h = now.hour % 12;
        if (h == 0) h = 12;

        it.printf(160, 25, id(font_clock), clk_color,
                  TextAlign::TOP_CENTER, "%d:%02d", h, now.minute);

        it.strftime(160, 135, id(f_ampm), clk_color,
                    TextAlign::TOP_CENTER, "%p", now);

        const char* days[]   = {"Sun","Mon","Tue","Wed","Thu","Fri","Sat"};
        const char* months[] = {"Jan","Feb","Mar","Apr","May","Jun",
                                "Jul","Aug","Sep","Oct","Nov","Dec"};

        int dow = now.day_of_week;
        if (dow < 0 || dow > 6) dow = 0;

        int mon = now.month - 1;
        if (mon < 0 || mon > 11) mon = 0;

        char date_buf[24];
        snprintf(date_buf, sizeof(date_buf), "%s, %s %d",
                 days[dow], months[mon], now.day_of_month);

        it.printf(160, 170, id(font_small), clk_color,
                  TextAlign::CENTER, "%s", date_buf);

        it.printf(160, 200, id(font_small), Color(186,186,186),
                  TextAlign::TOP_CENTER, "Touch for menu");
      }
      
      else if (id(screen_mode) == 1) {
        // MENU / EFFECT
        it.printf(160, 12, id(font_big), Color(255,80,120), TextAlign::TOP_CENTER, "♥ Love Menu ♥");

        it.rectangle(15, 65, 290, 45, Color(80,80,80));
        it.printf(160, 78, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER,
                  "Song: %s", id(song_name).c_str());

        // LED mode button - left
        it.rectangle(15, 118, 135, 45, Color(80,80,80));
        it.printf(82, 123, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER,
                  "LED MODE");
        it.printf(82, 144, id(font_small), Color(52,209,198), TextAlign::TOP_CENTER,
                  "%s", id(mode_name).c_str());

        // Playback target button - right
        it.rectangle(170, 118, 135, 45, Color(80,80,80));
        it.printf(237, 123, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER,
                  "OUTPUT");
        it.printf(237, 144, id(font_small), Color(255,220,120), TextAlign::TOP_CENTER,
                  "%s", id(playback_target_name).c_str());

        it.filled_rectangle(15, 178, 135, 45, Color(0,120,80));
        it.printf(82, 191, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER, "START");

        it.filled_rectangle(170, 178, 135, 45, Color(130,30,30));
        it.printf(237, 191, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER, "STOP");
      } 

      else if (id(screen_mode) == 2) {
        // NOW PLAYING MENU
        it.printf(160, 15, id(font_big), Color(255,80,120), TextAlign::TOP_CENTER, "♥ Now Playing ♥");

        it.printf(160, 72, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER,
                  "%s", id(song_name).c_str());       
        it.printf(160, 115, id(font_small), Color(52,209,198), TextAlign::TOP_CENTER, "Playing");
        

        // Optional note/message
        it.printf(160, 148, id(font_small), Color(220,220,220), TextAlign::TOP_CENTER,
                  "%s", id(active_message).c_str());

        // Buttons
        it.filled_rectangle(15, 185, 135, 42, Color(0,120,80));
        it.printf(82, 197, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER, "RESTART");

        it.filled_rectangle(170, 185, 135, 42, Color(130,30,30));
        it.printf(237, 197, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER, "STOP");
      }

      else if (id(screen_mode) == 3) {
        it.printf(160, 55, id(font_big), Color(255,220,0), TextAlign::TOP_CENTER, "Loading...");
        it.printf(160, 115, id(font_small), Color(255,255,255), TextAlign::TOP_CENTER,
                  "%s", id(song_name).c_str());
        it.printf(160, 175, id(font_small), Color(160,160,160), TextAlign::TOP_CENTER,
                  "Starting audio");
      }

      else if (id(screen_mode) == 4) {
        it.printf(160, 75, id(font_big), Color(255,120,80), TextAlign::TOP_CENTER, "Stopping...");
        it.printf(160, 145, id(font_small), Color(160,160,160), TextAlign::TOP_CENTER,
                  "Please wait");
      }

# ---------- TOUCH ----------
i2c:
  id: i2c_bus
  sda: GPIO16
  scl: GPIO15
  scan: true

touchscreen:
  platform: ft63x6
  address: 0x38
  interrupt_pin: GPIO17
  reset_pin: GPIO18
  transform:
    swap_xy: true
    mirror_x: false
    mirror_y: true 
  on_touch:
    then:
      - lambda: |-

          static uint32_t last_touch = 0;
          if (millis() - last_touch < 500) return;
          last_touch = millis();

          int x = touch.x;
          int y = touch.y;

          if (id(ui_busy)) {
            return;
          }

          // If currently on Playing screen, ONLY handle Restart / Stop
          if (id(screen_mode) == 2) {
            if (x < 160 && y >= 178) {
              id(play_selected_song).execute();   // restart
            } else if (x >= 160 && y >= 178) {
              id(stop_song).execute();
            }
            return;
          }

          // Otherwise we're in menu/clock → switch to menu
          id(screen_mode) = 1;
          id(menu_timer) = 20;

          // Top area: song selector
          if (y >= 65 && y <= 110) {
            id(song_index) = (id(song_index) + 1) % 5;

            if (id(song_index) == 0) id(song_name) = "Song1";
            else if (id(song_index) == 1) id(song_name) = "Song2";
            else if (id(song_index) == 2) id(song_name) = "Song3";
            else if (id(song_index) == 3) id(song_name) = "Song4";
            else if (id(song_index) == 4) id(song_name) = "Song5";
          }

          // Middle row: left = LED mode, right = playback target
          else if (y >= 118 && y <= 163) {
            if (x < 160) {
              id(next_led_mode).execute();
            } else {
              id(next_playback_target).execute();
            }
          }

          // Bottom-left: Start
          else if (x < 160 && y >= 178) {
            id(play_selected_song).execute();
          }

          // Bottom-right: Stop
          else if (x >= 160 && y >= 178) {
            id(stop_song).execute();
          }

# ---------- AUDIO / ES8311 ----------
# ---------- AUDIO / ES8311 + I2S SPEAKER ----------
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO7

speaker:
  - platform: i2s_audio
    id: heart_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO8
    dac_type: external
    audio_dac: es8311_dac
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 500ms

media_player:
  - platform: speaker
    id: heart_media_player
    name: "${friendly_name} Speaker"
    buffer_size: 600000
    codec_support_enabled: NEEDED
    task_stack_in_psram: false
    announcement_pipeline:
      speaker: heart_speaker
      format: MP3
      num_channels: 1
      sample_rate: 16000

switch:
  - platform: gpio
    id: audio_enable
    name: "${friendly_name} Audio Enable"
    pin:
      number: GPIO1
      inverted: true   # ON pulls GPIO1 low
    restore_mode: RESTORE_DEFAULT_ON

# ---------- BACKLIGHT ----------
output:
  - platform: ledc
    pin: GPIO45
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "${friendly_name} Backlight"
    restore_mode: ALWAYS_ON

# ---------- HEART LEDs ----------
  - platform: esp32_rmt_led_strip
    id: heart_leds
    name: "${friendly_name} LEDs"
    pin: ${led_pin}
    num_leds: ${led_count}
    rgb_order: RGB
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_rainbow:
          name: "Rainbow"

      - addressable_twinkle:
          name: "Twinkle"

      - pulse:
          name: "Pulse"

      - random:
          name: "Random"

      - addressable_lambda:
          name: "Heartbeat"
          update_interval: 20ms
          lambda: |-
            static uint32_t start = millis();
            uint32_t t = (millis() - start) % 1200;

            float level = 0.0;
            if (t < 80) level = 1.0;
            else if (t < 140) level = 0.35;
            else if (t < 220) level = 0.85;
            else level = 0.0;

            uint8_t r = level * 255;
            uint8_t g = level * 35;
            uint8_t b = level * 10;

            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(r,g,b);
            }


# ---------- MODE SWITCH ----------
script:
  - id: next_led_mode
    then:
      - lambda: |-
          id(mode_index) = (id(mode_index) + 1) % 6;

      - if:
          condition:
            lambda: 'return id(mode_index) == 0;'
          then:
            - light.turn_off: heart_leds
            - lambda: 'id(mode_name) = "Off";'

      - if:
          condition:
            lambda: 'return id(mode_index) == 1;'
          then:
            - light.turn_on:
                id: heart_leds
                brightness: 40%
                red: 100%
            - lambda: 'id(mode_name) = "Solid Red";'

      - if:
          condition:
            lambda: 'return id(mode_index) == 2;'
          then:
            - light.turn_on:
                id: heart_leds
                effect: "Heartbeat"
            - lambda: 'id(mode_name) = "Heartbeat";'

      - if:
          condition:
            lambda: 'return id(mode_index) == 3;'
          then:
            - light.turn_on:
                id: heart_leds
                effect: "Rainbow"
            - lambda: 'id(mode_name) = "Rainbow";'

      - if:
          condition:
            lambda: 'return id(mode_index) == 4;'
          then:
            - light.turn_on:
                id: heart_leds
                effect: "Twinkle"
            - lambda: 'id(mode_name) = "Twinkle";'

      - if:
          condition:
            lambda: 'return id(mode_index) == 5;'
          then:
            - light.turn_on:
                id: heart_leds
                effect: "Pulse"
            - lambda: 'id(mode_name) = "Pulse";'

  - id: play_selected_song
    mode: restart
    then:
      - lambda: |-
          id(screen_mode) = 3;   // loading
          id(ui_busy) = true;
          id(busy_timer) = ${busy_timeout_seconds};
          id(menu_timer) = 0;

          const char* messages[] = {
            "I will always love you!",
            "You are my favorite person.",
            "Forever and always.",
            "You make every day better.",
            "You are my beautiful mess."
          };

          id(active_message) = messages[random_uint32() % 5];

      - light.turn_on:
          id: heart_leds
          brightness: 45%
          effect: "Heartbeat"

      - homeassistant.event:
          event: esphome.moms_heart_v2_play_song
          data:
            song_index: !lambda 'return id(song_index);'
            song_name: !lambda 'return id(song_name);'
            playback_target: !lambda 'return id(playback_target_name);'
            playback_target_index: !lambda 'return id(playback_target_index);'

  - id: stop_song
    mode: restart
    then:
      - lambda: |-
          id(screen_mode) = 4;   // stopping
          id(ui_busy) = true;
          id(busy_timer) = ${busy_timeout_seconds};

      - homeassistant.event:
          event: esphome.moms_heart_v2_stop_song
          data:
            playback_target_index: !lambda 'return id(playback_target_index);'
            playback_target: !lambda 'return id(playback_target_name);'        

  - id: next_playback_target
    then:
      - lambda: |-
          id(playback_target_index) = (id(playback_target_index) + 1) % 2;

          if (id(playback_target_index) == 0) {
            id(playback_target_name) = "Local";
          } else {
            id(playback_target_name) = "Sonos";
          }          

# ---------- MENU TIMEOUT ----------
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(busy_timer) > 0) {
            id(busy_timer)--;
            if (id(busy_timer) <= 0) {
              id(ui_busy) = false;

              if (id(screen_mode) == 3) {
                id(screen_mode) = 2;   // loading -> playing
              } else if (id(screen_mode) == 4) {
                id(screen_mode) = 0;   // stopping -> clock
              }
            }
          }

          if (!id(ui_busy) && id(screen_mode) == 1) {
            if (id(menu_timer) > 0) {
              id(menu_timer)--;
            } else {
              id(screen_mode) = 0;
            }
          }
