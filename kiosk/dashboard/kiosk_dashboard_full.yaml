title: Home
sections:
  - type: grid
    cards:
      - type: heading
        heading: ✅ 1. Kiosk Status Header (Live Health)
        heading_style: title
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: ✅ Kiosk Online
            secondary: >
              {{ states('sensor.galaxy_tab_active3_battery_2') | float(0) |
              round(1) }}% •  {{ states('sensor.new_kiosk_kiosk_temperature') |
              float(0) | round(1) }}°F •  VIN {{
              states('sensor.new_kiosk_kiosk_vin_voltage') | float(0) | round(1)
              }}V
            icon: mdi:tablet-dashboard
            color: >
              {% if is_state('binary_sensor.new_kiosk_new_kiosk_online','on') %}
              green {% else %} red {% endif %}
            features_position: bottom
      - type: heading
        heading: 🎁 2. Kiosk Control Core
        heading_style: title
      - type: grid
        columns: 3
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.new_kiosk_kiosk_timer_start
            name: Start Timer
            icon: mdi:timer-play
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.new_kiosk_kiosk_timer_stop
            name: Stop Timer
            icon: mdi:timer-stop
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.new_kiosk_kiosk_timer_reset
            name: Reset Timer
            icon: mdi:backup-restore
            tap_action:
              action: toggle
        grid_options:
          columns: 12
          rows: 1
      - type: custom:mushroom-template-card
        primary: Time Remaining
        secondary: "{{ states('sensor.new_kiosk_kiosk_timer_remaining') }}"
        icon: mdi:timer
        icon_color: green
        progress: >
          {% set t = states('sensor.new_kiosk_kiosk_timer_remaining') %} {% if
          ':' in t %}
            {% set m, s = t.split(':') %}
            {% set remaining = (m|int * 60) + (s|int) %}
            {% set total = states('number.new_kiosk_kiosk_timer_duration_s') | int %}
            {{ (remaining / total * 100) | round(0) }}
          {% else %}
            0
          {% endif %}
        layout: default
        multiline_secondary: false
      - type: heading
        icon: mdi:fridge
        heading: 🎄 3. LID CONTROL (Big & Dramatic)
        heading_style: title
      - type: custom:mushroom-cover-card
        entity: cover.new_kiosk_kiosk_lid
        name: New Kiosk Lid
        show_position_control: false
        show_tilt_position_control: false
        show_buttons_control: true
        layout: horizontal
        fill_container: false
        card_mod:
          style: |
            ha-card {
              {% if is_state('cover.new_kiosk_kiosk_lid', 'open') %}
                border: 2px solid #FFC107 !important;
                box-shadow: 0 0 6px #FFC107;
              {% else %}
                border: none;
                box-shadow: none;
              {% endif %}
            }
      - type: grid
        columns: 3
        cards:
          - type: custom:mushroom-entity-card
            name: Rain Sensor
            icon: mdi:weather-pouring
            tap_action:
              action: toggle
            entity: binary_sensor.new_kiosk_rain_do
          - type: custom:mushroom-entity-card
            name: "Rain Left "
            icon: mdi:flash-triangle
            tap_action:
              action: toggle
            entity: sensor.new_kiosk_rain_analog_1
          - type: custom:mushroom-entity-card
            name: Rain Right
            icon: mdi:weather-hail
            tap_action:
              action: toggle
            entity: sensor.new_kiosk_rain_analog_2
        grid_options:
          columns: 12
          rows: 1
      - type: heading
        icon: mdi:fridge
        heading: 🎶 4. AUDIO + AMP POWER
        heading_style: title
      - type: grid
        columns: 3
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.new_kiosk_big_amp_power
            name: Big Amp
            icon: mdi:speaker
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.new_kiosk_small_pa_amp
            name: Small PA
            icon: mdi:bullhorn
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.new_kiosk_fan_power
            name: Cooling Fan
            icon: mdi:fan
            tap_action:
              action: toggle
        grid_options:
          columns: 12
          rows: 1
      - type: heading
        icon: mdi:fridge
        heading: 🎅 5. CHRISTMAS DISPLAY LIGHTS
        heading_style: title
      - type: vertical-stack
        cards:
          - type: custom:mushroom-light-card
            entity: light.new_kiosk_display_lights
            name: Display Lights
            show_brightness_control: true
            show_color_control: true
            show_effect_list: true
          - type: custom:mushroom-number-card
            entity: number.new_kiosk_candy_cane_speed
            name: Candy Cane Speed
      - type: custom:mushroom-template-card
        entity: sensor.kiosk_display_effect
        primary: |
          {{ states('sensor.kiosk_display_effect') }}
        secondary: Current LED Effect
        icon: mdi:led-strip-variant
        grid_options:
          columns: full
        features_position: bottom
        card_mod:
          style: |
            {% set effect = states('sensor.kiosk_display_effect') %}
            /* === 1. MAIN CARD (The Animation Layer) === */
            ha-card {
              position: relative;
              padding: 12px !important; 
              overflow: hidden;
              transition: all 0.5s ease;
              border: none;
              background: #111; 
              --primary-text-color: #ffffff !important;
              --secondary-text-color: #ffffff !important;
            }

            /* === 2. THE BLACK MASK (The Inner Card) === */
            ha-card::before {
              content: "";
              position: absolute;
              top: 6px;
              bottom: 6px;
              left: 6px;
              right: 6px;
              background: #111111;
              border-radius: 12px;
              z-index: 1;
            }

            /* === 3. CONTENT LAYERING === */
            /* Container needs to be above the mask */
            ha-card > div {
              position: relative;
              z-index: 10 !important;
              transform: translateY(-10px) !important;
            }

            mushroom-state-item {
              position: relative;
              z-index: 10 !important;
            }

            mushroom-state-info {
              position: relative;
              z-index: 10 !important;
            }

            /* Force white text */
            mushroom-state-info .primary,
            mushroom-state-info .secondary {
              color: #ffffff !important;
            }

            /* Icon styling */
            mushroom-shape-icon {
              position: relative;
              z-index: 10 !important;
              --icon-color: white !important;
              --shape-color: rgba(255,255,255,0.15) !important;
            }

            /* === 4. PRICKLY GUY === */
            ha-card::after {
              content: "";
              position: absolute;
              bottom: -4px;
              right: -4px;
              width: 65px;
              height: 65px;
              background-image: url("/local/prickly_guy_small.png");
              background-size: contain;
              background-repeat: no-repeat;
              z-index: 11;
              transform: rotate(-10deg);
              pointer-events: none;
              filter: drop-shadow(-2px -2px 4px rgba(0,0,0,0.8));
            }

            /* ====================================================== */
            /* 🎅 ANIMATIONS */
            /* ====================================================== */
            {% if effect == 'Candy Cane' %}
            @keyframes candy_scroll {
              0% { background-position: 0 0; }
              100% { background-position: 565.6px 565.6px; }
            }
            ha-card {
              background: repeating-linear-gradient(
                45deg,
                #ff0000,
                #ff0000 10px,
                #ffffff 10px,
                #ffffff 20px
              );
              animation: candy_scroll 6s linear infinite;
              box-shadow: 0 0 15px rgba(255, 0, 0, 0.6); 
            }
            {% endif %}

            {% if effect == 'Christmas Twinkle' %}
            @keyframes xmas_scroll {
              0% { background-position: 0 0; }
              100% { background-position: -565.6px 565.6px; }
            }
            ha-card {
              background: repeating-linear-gradient(
                45deg,
                #ff0000,
                #ff0000 10px,
                #00ff00 10px,
                #00ff00 20px
              );
              animation: xmas_scroll 6s linear infinite;
              box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            }
            {% endif %}

            {% if effect == 'Rain Flash Blue' %}
            @keyframes rain_pulse {
              0% { box-shadow: 0 0 10px rgba(0,128,255,0.5); }
              50% { box-shadow: 0 0 20px rgba(0,128,255,1); }
              100% { box-shadow: 0 0 10px rgba(0,128,255,0.5); }
            }
            ha-card {
              background: linear-gradient(135deg, #0044ff, #00ccff);
              animation: rain_pulse 2s infinite;
            }
            {% endif %}

            {% if effect == "None" or effect == "" %}
            ha-card {
              background: linear-gradient(135deg, #111111, #111111);
              box-shadow: none;
            }
            {% endif %}
  - type: grid
