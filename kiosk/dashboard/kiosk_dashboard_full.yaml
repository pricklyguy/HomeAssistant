        heading: ❄️ 9. ENVIRONMENT + RAIN STATUS
        heading_style: title
      - type: glance
        columns: 4
        entities:
          - sensor.new_kiosk_kiosk_temperature
          - sensor.new_kiosk_kiosk_humidity
          - binary_sensor.new_kiosk_rain_do
          - binary_sensor.new_kiosk_pir_motion
  - type: grid
    cards:
      - show_name: true
        show_icon: true
        type: button
        entity: switch.xlights_group
        icon: mdi:string-lights
        grid_options:
          columns: full
        tap_action:
          action: toggle
        card_mod:
          style: |
            ha-card {
              {% if is_state('switch.xlights_group', 'on') %}
                border: 2px solid #FFC107 !important; /* Amber Border */
                box-shadow: 0 0 6px #FFC107; /* Amber Glow */
              {% else %}
                border: none;
                box-shadow: none;
              {% endif %}
            }
      - type: custom:mushroom-entity-card
        entity: switch.xlights_group
        tap_action:
          action: toggle
        icon: mdi:power-plug
        icon_color: blue
        name: xLights Group
        card_mod:
          style:
            mushroom-shape-icon$: |
              .shape {
                {# ========== USER CONFIG ========== #}
                {# true = number mode, false = state mode #}
                {% set use_number      = false %}

                {# STATE MODE SETTINGS #}
                {% set state_entity    = 'switch.xlights_group' %}
                {% set active_value    = 'on' %}

                {# OPTIONAL: NUMBER MODE SETTINGS #}
                {% set number_entity   = 'sensor.plug_power' %}
                
                {# '>' '<' '=' '>=' '<=' #}
                {% set number_operator = '>' %}
                
                {% set threshold       = 0.0 %}
                {# ========== END USER CONFIG ====== #}

                {# ======== TRIGGER DECISION LOGIC ======== #}
                {% if use_number %}
                  {% set num = states(number_entity) | float(0) %}
                  
                  {# Evaluate numeric rule #}
                  {% if number_operator == '>' %}
                    {% set trigger_active = (num > threshold) %}
                  {% elif number_operator == '<' %}
                    {% set trigger_active = (num < threshold) %}
                  {% elif number_operator == '=' %}
                    {% set trigger_active = (num == threshold) %}
                  {% elif number_operator == '>=' %}
                    {% set trigger_active = (num >= threshold) %}
                  {% elif number_operator == '<=' %}
                    {% set trigger_active = (num <= threshold) %}
                  {% else %}
                    {% set trigger_active = false %}
                  {% endif %}

                {% else %}
                  {# State mode #}
                  {% if states(state_entity) == active_value %}
                    {% set trigger_active = true %}
                  {% else %}
                    {% set trigger_active = false %}
                  {% endif %}
                {% endif %}
                {# =========== END TRIGGER LOGIC =========== #}

                {% if trigger_active %}
                  --shape-animation: ring-breathe 1.8s ease-out infinite;
                  opacity: 1;
                {% else %}
                  --shape-animation: none;
                  opacity: 0.7;
                {% endif %}
              }

              @keyframes ring-breathe {
                0%   { box-shadow: 0 0 0 0 rgba(var(--rgb-{{ config.icon_color }}), 0.9); }
                70%  { box-shadow: 0 0 0 14px rgba(var(--rgb-{{ config.icon_color }}), 0.0); }
                100% { box-shadow: 0 0 0 0 rgba(var(--rgb-{{ config.icon_color }}), 0.0); }
              }
            .: |
              mushroom-shape-icon {
                --icon-size: 65px;
                display: flex;
                margin: -18px 0 10px -20px !important;
                padding-right: 10px;
              }
              ha-card {
                clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 12px));
              }
      - type: markdown
