            entity: number.galaxy_tab_active3_screen_brightness_2
      - type: heading
        icon: mdi:fridge
        heading: 🎥 8. LIVE KIOSK CAMERA
        heading_style: title
      - type: picture-entity
        entity: camera.new_kiosk
        name: 🎥 Kiosk Cam
      - type: heading
